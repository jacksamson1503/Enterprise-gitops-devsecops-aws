name: CI/CD Pipeline — Test, Docker & Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  # =========================================================================
  # STAGE 1: TEST STAGE
  # =========================================================================
  test-stage:
    name: 1. Automated Test Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Production Structure & Syntax
        run: |
          echo "Running syntax and integrity tests..."
          REQUIRED_PAGES=("index.html" "cart.html" "checkout.html" "processing.html" "confirmation.html" "login.html")
          for page in "${REQUIRED_PAGES[@]}"; do
            test -f "$page" || (echo "Missing $page" && exit 1)
          done
          for script in js/*.js; do
            node --check "$script"
          done
          echo "Test Stage PASSED: Codebase verified."

  # =========================================================================
  # STAGE 2: DOCKER BUILD TEST STAGE
  # =========================================================================
  docker-stage:
    name: 2. Docker Image Build Test
    needs: test-stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image Test
        run: |
          echo "Testing Dockerfile build on GitHub runner..."
          docker build -t kilnclay-test:${{ github.sha }} .
          echo "Docker Stage PASSED: Dockerfile builds cleanly."

  # =========================================================================
  # STAGE 3: DEPLOY CONTAINER TO EC2 SERVER STAGE
  # =========================================================================
  deploy-ec2-stage:
    name: 3. Build & Run Docker Container on EC2
    needs: docker-stage
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Docker Deployment on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Pulling latest code on EC2 server..."
            cd ~/kilnclay || git clone https://github.com/jacksamson1503/kilnclay.git ~/kilnclay
            cd ~/kilnclay
            git pull origin main
            
            echo "Stopping host Nginx service so Port 80 is freed for Docker..."
            sudo systemctl stop nginx 2>/dev/null || true
            sudo systemctl disable nginx 2>/dev/null || true
            
            echo "Building Docker image on EC2..."
            sudo docker build -t kilnclay:latest .
            
            echo "Removing any existing old container..."
            sudo docker stop kilnclay-app 2>/dev/null || true
            sudo docker rm kilnclay-app 2>/dev/null || true
            
            echo "Running new Docker container on Port 80..."
            sudo docker run -d --name kilnclay-app -p 80:80 --restart unless-stopped kilnclay:latest
            
            echo "===================================================="
            echo "DOCKER STATUS ON EC2:"
            sudo docker ps
            echo "===================================================="
            
            # Health check container response
            sleep 2
            curl -I http://localhost
            echo "SUCCESS: Docker container is running and serving website!"
