name: Enterprise CI/CD Pipeline - Test, Scan, ECR & GitOps Sync

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 181188392988.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: server
  SNS_TOPIC_ARN: arn:aws:sns:us-east-1:181188392988:aws-daily-operations-report
  GEMINI_MODEL: gemini-1.5-flash

jobs:
  # ===========================================================================
  # STAGE 1: CODE INTEGRITY TESTS
  # ===========================================================================
  code-quality-and-test:
    name: 1. Code Integrity & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Integrity & Syntax Tests
        run: |
          REQUIRED_PAGES=("index.html" "cart.html" "checkout.html" "processing.html" "confirmation.html" "login.html")
          for page in "${REQUIRED_PAGES[@]}"; do
            test -f "$page" || { echo "::error::Missing required page: $page"; exit 1; }
          done
          for script in js/*.js; do
            [ -f "$script" ] && node --check "$script"
          done
          echo "STAGE 1 PASSED: Codebase verified."

  # ===========================================================================
  # STAGE 2: BUILD -> TRIVY SCAN -> PUSH TO ECR (With Direct AI Diagnostics)
  # ===========================================================================
  build-scan-push:
    name: 2. Build, Scan & Push to ECR
    needs: code-quality-and-test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
      diagnosis: ${{ steps.ai_diag.outputs.diagnosis }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short Commit SHA Tag
        id: set-tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Configures AWS Credentials (supports both OIDC and Access Keys)
      - name: Configure AWS Credentials
        id: aws_login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }} . 2>&1 | tee build.log

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL'

      - name: Push Image to ECR
        run: |
          docker push "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}"

      # -----------------------------------------------------------------------
      # AI ANALYSIS (Runs directly on failure, reads real local logs!)
      # -----------------------------------------------------------------------
      - name: AI Failure Diagnosis
        id: ai_diag
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LOG_TAIL=$(tail -n 60 build.log 2>/dev/null || echo "Failure occurred before or during Docker/AWS authentication step.")
          CLEAN_LOG=$(echo "$LOG_TAIL" | sed -E 's/AKIA[0-9A-Z]{16}/[REDACTED]/g; s/[0-9]{12}/[REDACTED]/g')

          PROMPT="You are a senior DevOps engineer. A GitHub Actions Docker/AWS build failed with this log: $CLEAN_LOG. In 3 short lines, state: 1) Root cause 2) Exact fix 3) Verification command."

          AI_TEXT="AI diagnosis not available. Please verify GEMINI_API_KEY secret."
          if [ -n "$GEMINI_API_KEY" ]; then
            RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}")
            AI_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "Please check logs above."')
          fi

          echo "## AI Failure Analysis" >> $GITHUB_STEP_SUMMARY
          echo "$AI_TEXT" >> $GITHUB_STEP_SUMMARY
          echo "diagnosis<<EOF" >> $GITHUB_OUTPUT
          echo "$AI_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ===========================================================================
  # STAGE 3: GITOPS - UPDATE ARGO ROLLOUT MANIFEST
  # ===========================================================================
  update-gitops-manifest:
    name: 3. Update Argo Rollout Manifest
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Image Tag in k8s/rollout.yaml
        env:
          IMAGE_REPO: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          NEW_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
        run: |
          sed -i -E "s|(image: ${IMAGE_REPO}):.*|\1:${NEW_TAG}|g" k8s/rollout.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/rollout.yaml
          git commit -m "chore(gitops): promote image ${NEW_TAG} to Blue/Green [skip ci]" || echo "No changes"
          git pull --rebase origin main
          git push origin main

      - name: Write Deployment Summary
        if: success()
        run: |
          echo "## Blue/Green Rollout Updated!" >> $GITHUB_STEP_SUMMARY
          echo "Argo CD will automatically sync the new version to Kubernetes." >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # STAGE 4: AWS SNS NOTIFICATION (Success & Failure)
  # ===========================================================================
  notify-sns:
    name: Send SNS Notification
    needs: [code-quality-and-test, build-scan-push]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to SNS
        continue-on-error: true
        env:
          STATUS: ${{ needs.build-scan-push.result == 'success' && 'SUCCEEDED' || 'FAILED' }}
          AI_DIAGNOSIS: ${{ needs.build-scan-push.outputs.diagnosis }}
        run: |
          MESSAGE="Pipeline ${STATUS} for commit ${GITHUB_SHA::7}.
          
          AI Diagnosis:
          ${AI_DIAGNOSIS:-All stages completed successfully.}"

          aws sns publish \
            --region "${{ env.AWS_REGION }}" \
            --topic-arn "${{ env.SNS_TOPIC_ARN }}" \
            --subject "[${STATUS}] Deployment Pipeline" \
            --message "$MESSAGE"
