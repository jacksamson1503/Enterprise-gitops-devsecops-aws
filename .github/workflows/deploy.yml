name: Enterprise CI/CD Pipeline — Test, Scan, ECR & GitOps Sync

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'

permissions:
  contents: write

jobs:
  # =========================================================================
  # STAGE 1: CODE INTEGRITY TESTS
  # =========================================================================
  code-quality-and-test:
    name: 1. Code Integrity & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Integrity & Syntax Tests
        run: |
          REQUIRED_PAGES=("index.html" "cart.html" "checkout.html" "processing.html" "confirmation.html" "login.html")
          for page in "${REQUIRED_PAGES[@]}"; do
            test -f "$page" || (echo "FAILED: Missing $page" && exit 1)
          done
          for script in js/*.js; do
            [ -f "$script" ] && node --check "$script"
          done
          echo "STAGE 1 PASSED: Codebase verified."

  # =========================================================================
  # STAGE 2: TRIVY SECURITY SCAN
  # =========================================================================
  security-scan:
    name: 2. Container Security Scan
    needs: code-quality-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Image for Scan
        run: docker build -t kilnclay-local:${{ github.sha }} .

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kilnclay-local:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # STAGE 3: BUILD & PUSH TO AWS ECR
  # =========================================================================
  build-and-push-ecr:
    name: 3. Push to Amazon ECR
    needs: security-scan
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short Commit SHA Tag
        id: set-tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Docker Image
        env:
          REGISTRY: 181188392988.dkr.ecr.us-east-1.amazonaws.com
          REPOSITORY: server
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

  # =========================================================================
  # STAGE 4: GITOPS AUTO-UPDATE (Argo Rollouts Blue/Green)
  # =========================================================================
  update-gitops-manifest:
    name: 4. Auto-Update Argo Rollout Manifest
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Image in k8s/rollout.yaml
        env:
          NEW_TAG: ${{ needs.build-and-push-ecr.outputs.image_tag }}
        run: |
          sed -i "s|image: 181188392988.dkr.ecr.us-east-1.amazonaws.com/server:.*|image: 181188392988.dkr.ecr.us-east-1.amazonaws.com/server:$NEW_TAG|g" k8s/rollout.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/rollout.yaml
          git commit -m "chore(gitops): promote image $NEW_TAG to Blue/Green [skip ci]" || echo "No changes"
          git push origin main

      # =========================================================================
      # SUCCESS SUMMARY: Formats a clean card on GitHub Job Summary!
      # =========================================================================
      - name: 5. Write Deployment Summary
        if: success()
        run: |
          echo "## Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ needs.build-and-push-ecr.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ECR Image** | \`181188392988.dkr.ecr.us-east-1.amazonaws.com/server:${{ needs.build-and-push-ecr.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Strategy** | **Blue/Green (Argo Rollouts)** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Argo CD Status** | Synced to Kubernetes Cluster |" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # GLOBAL AI FAILURE DOCTOR: Catches errors if ANY job fails!
  # =========================================================================
  ai-failure-doctor:
    name: AI Pipeline Failure Doctor
    if: failure()
    needs: [code-quality-and-test, security-scan, build-and-push-ecr, update-gitops-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Failure with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "## Pipeline Failed!" >> $GITHUB_STEP_SUMMARY
          echo "Analyzing root cause with AI..." >> $GITHUB_STEP_SUMMARY

          PROMPT="A production CI/CD pipeline on main branch failed during testing, Docker build, Trivy scan, or ECR push. In 3 simple sentences, explain the common reasons for this failure and give the troubleshooting commands."

          if [ -n "$GEMINI_API_KEY" ]; then
            AI_ANALYSIS=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null || echo "Inspect step logs above.")
            
            echo "### AI Diagnosis & Next Steps:" >> $GITHUB_STEP_SUMMARY
            echo "$AI_ANALYSIS" >> $GITHUB_STEP_SUMMARY
          else
            echo "To get automated AI fix recommendations, please add the GEMINI_API_KEY secret." >> $GITHUB_STEP_SUMMARY
          fi