name: Enterprise CI/CD Pipeline — Test, Scan, ECR & GitOps Sync

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'   # Prevents infinite loops when the pipeline updates YAML

# Grant permission for GitHub Actions to update the k8s manifest
permissions:
  contents: write

jobs:
  # =========================================================================
  # STAGE 1: CODE QUALITY & SYNTAX TESTS
  # =========================================================================
  code-quality-and-test:
    name: 1. Code Integrity & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Integrity & Syntax Tests
        run: |
          echo "Validating core production pages..."
          REQUIRED_PAGES=("index.html" "cart.html" "checkout.html" "processing.html" "confirmation.html" "login.html")
          for page in "${REQUIRED_PAGES[@]}"; do
            test -f "$page" || (echo "FAILED: Missing $page" && exit 1)
          done

          echo "Validating JavaScript syntax..."
          for script in js/*.js; do
            [ -f "$script" ] && node --check "$script"
          done
          echo "STAGE 1 PASSED: Codebase verified."

  # =========================================================================
  # STAGE 2: SECURITY & VULNERABILITY SCAN (TRIVY)
  # =========================================================================
  security-scan:
    name: 2. Container Security & Vulnerability Scan
    needs: code-quality-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Security Testing
        run: |
          docker build -t kilnclay-local:${{ github.sha }} .

      - name: Scan Image for Vulnerabilities (Aquasec Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kilnclay-local:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # STAGE 3: BUILD & PUSH IMMUTABLE IMAGE TO AWS ECR
  # =========================================================================
  build-and-push-ecr:
    name: 3. Authenticate & Push to Amazon ECR
    needs: security-scan
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short Commit SHA Tag
        id: set-tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Docker Image
        env:
          REGISTRY: 181188392988.dkr.ecr.us-east-1.amazonaws.com
          REPOSITORY: server
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          echo "Building Docker container..."
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          
          echo "Pushing immutable SHA tag: $IMAGE_TAG"
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          
          echo "Pushing 'latest' tag..."
          docker push $REGISTRY/$REPOSITORY:latest
          echo "STAGE 3 PASSED: Docker image successfully pushed to AWS ECR!"

  # =========================================================================
  # STAGE 4: GITOPS AUTO-UPDATE (TRIGGERS ARGOCD)
  # =========================================================================
  update-gitops-manifest:
    name: 4. Auto-Update Kubernetes Manifest (GitOps)
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Git Token
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Image Tag in k8s/deployment.yaml
        env:
          NEW_TAG: ${{ needs.build-and-push-ecr.outputs.image_tag }}
        run: |
          echo "Updating deployment.yaml with new tag: $NEW_TAG"
          sed -i "s|image: 181188392988.dkr.ecr.us-east-1.amazonaws.com/server:.*|image: 181188392988.dkr.ecr.us-east-1.amazonaws.com/server:$NEW_TAG|g" k8s/deployment.yaml
          
          echo "Configuring Git bot committer..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add k8s/deployment.yaml
          git commit -m "chore(gitops): auto-promote new image tag $NEW_TAG [skip ci]" || echo "No changes to commit"
          git push origin main
          echo "STAGE 4 PASSED: GitOps manifest updated! ArgoCD will auto-sync."