version: '3.8'

services:
  web:
    build: .
    container_name: kiln-clay-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - RDS_HOST=postgres-db
      - RDS_PORT=5432
      - RDS_DATABASE=kilnclay_orders
      - RDS_USER=postgres
      - RDS_PASSWORD=devpassword
    depends_on:
      - postgres-db

  postgres-db:
    image: postgres:16-alpine
    container_name: kiln-clay-postgres
    environment:
      - POSTGRES_DB=kilnclay_orders
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
