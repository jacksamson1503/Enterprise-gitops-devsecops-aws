apiVersion: apps/v1
kind: Deployment
metadata:
  name: kilnclay-deployment
  labels:
    app: kilnclay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kilnclay
  template:
    metadata:
      labels:
        app: kilnclay
    spec:
      containers:
      - name: kilnclay-container
        image: 181188392988.dkr.ecr.us-east-1.amazonaws.com/server:e4fbff6
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"