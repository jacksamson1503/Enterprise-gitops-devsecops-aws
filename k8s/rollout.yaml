apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kilnclay-rollout
  labels:
    app: kilnclay
spec:
  replicas: 2
  strategy:
    blueGreen:
      activeService: kilnclay-active-service
      previewService: kilnclay-preview-service
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 30
  selector:
    matchLabels:
      app: kilnclay
  template:
    metadata:
      labels:
        app: kilnclay
    spec:
      containers:
      - name: kilnclay-container
        image: 181188392988.dkr.ecr.us-east-1.amazonaws.com/server:91b5056
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
